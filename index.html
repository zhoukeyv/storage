        // ======================= 文件操作 =======================
        function toggleFileSelection(fullPath, checked) {
            if (checked) selectedFiles.add(fullPath);
            else selectedFiles.delete(fullPath);
            updateBatchActions();
        }
        function updateBatchActions() {
            const el = document.getElementById('batchActions');
            const count = selectedFiles.size;
            if (count > 0) {
                el.classList.add('show');
                document.getElementById('selectedCount').innerText = `已选择 ${count} 个文件`;
            } else {
                el.classList.remove('show');
            }
        }

        async function renameFile(file) {
            const newName = await showModal({ 
                type: 'prompt', title: '重命名文件', 
                message: `当前名称：${file.fileName}`, defaultValue: file.fileName 
            });
            if (!newName || newName.trim() === '' || newName === file.fileName) return;
            
            const folderPrefix = file.folderPath
                ? file.folderPath.split('/').filter(p => p).map(p => encodeBaseName(p)).join('__') + '___'
                : '';
            const newBaseName = `F_${folderPrefix}${encodeBaseName(newName.trim())}_${file.timestamp}`;
            
            try {
                const resp = await fetch(`${WORKER_URL}/rename?oldPrefix=${encodeURIComponent(file.baseName)}&newPrefix=${encodeURIComponent(newBaseName)}`, {
                    method: 'POST'
                });
                if (!resp.ok) throw new Error(await resp.text());
                await loadFiles();
            } catch (e) {
                await showModal({ type: 'alert', title: '失败', message: e.message });
            }
        }

        async function deleteFile(file) {
            const confirmed = await showModal({ 
                type: 'confirm', title: '确认删除', 
                message: `确定要删除「${file.fileName}」吗？此操作不可恢复。` 
            });
            if (!confirmed) return;
            
            try {
                const resp = await fetch(`${WORKER_URL}/delete?prefix=${encodeURIComponent(file.baseName)}`, {
                    method: 'DELETE'
                });
                if (!resp.ok) throw new Error(await resp.text());
                selectedFiles.delete(file.fullPath);
                updateBatchActions();
                await loadFiles();
            } catch (e) {
                await showModal({ type: 'alert', title: '失败', message: e.message });
            }
        }

        async function batchDelete() {
            if (selectedFiles.size === 0) return;
            const confirmed = await showModal({ 
                type: 'confirm', title: '批量删除', 
                message: `确定要删除选中的 ${selectedFiles.size} 个文件吗？此操作不可恢复。` 
            });
            if (!confirmed) return;
            
            for (const fullPath of selectedFiles) {
                const file = globalFiles[fullPath];
                if (!file) continue;
                try {
                    await fetch(`${WORKER_URL}/delete?prefix=${encodeURIComponent(file.baseName)}`, { method: 'DELETE' });
                } catch (e) { console.error(e); }
            }
            selectedFiles.clear();
            updateBatchActions();
            await loadFiles();
        }

        async function batchDownload() {
            if (selectedFiles.size === 0) return;
            const files = Array.from(selectedFiles).map(fullPath => globalFiles[fullPath]).filter(Boolean);
            
            let asZip = false;
            if (files.length >= 3) {
                const choice = await showModal({
                    type: 'confirm',
                    title: '批量下载方式',
                    message: `共 ${files.length} 个文件，确定 = 打包为 ZIP 下载，取消 = 分别下载`
                });
                asZip = !!choice;
            }
            
            selectedFiles.clear();
            updateBatchActions();
            document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = false);
            document.querySelectorAll('.file-item').forEach(item => item.classList.remove('selected'));
            
            if (asZip) {
                await downloadFilesAsZip(files, `download_${Date.now()}`);
            } else {
                files.forEach((f, i) => {
                    setTimeout(() => openFileLink(f.baseName, f.fileName, 'download'), i * 300);
                });
            }
        }

        async function downloadFilesAsZip(files, zipName) {
            const totalSize = files.reduce((sum, f) => sum + f.parts.reduce((s, p) => s + p.size, 0), 0);
            
            const taskId = 'dl-zip-' + Date.now();
            const taskEl = document.createElement('div');
            taskEl.className = 'task-item';
            taskEl.id = taskId;
            taskEl.innerHTML = `
                <div class="task-header">
                    <span class="task-name">📦 ${esc(zipName)}.zip</span>
                    <span class="task-meta"><span class="task-status">准备中...</span></span>
                </div>
                <div class="progress-bg"><div class="progress-fill"></div></div>
            `;
            document.getElementById('uploadQueue').appendChild(taskEl);
            
            const update = (text, percent) => {
                taskEl.querySelector('.task-status').innerText = text;
                if (percent !== undefined) taskEl.querySelector('.progress-fill').style.width = percent + '%';
            };
            
            try {
                const zip = new JSZip();
                let downloaded = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    update(`下载 (${i+1}/${files.length}) ${file.fileName}`, (downloaded / totalSize) * 100);
                    
                    const link = `${WORKER_URL}/dl/${currentUserHash}/${file.baseName}/${encodeURIComponent(file.fileName)}?download=1`;
                    const resp = await fetch(link);
                    if (!resp.ok) throw new Error(`下载失败: ${file.fileName}`);
                    const blob = await resp.blob();
                    
                    const pathInZip = file.folderPath ? `${file.folderPath}/${file.fileName}` : file.fileName;
                    zip.file(pathInZip, blob);
                    downloaded += blob.size;
                }
                
                const zipBlob = await zip.generateAsync(
                    { type: 'blob', compression: 'STORE' },
                    (meta) => update(`打包中 ${meta.percent.toFixed(0)}%`, 100)
                );
                
                taskEl.querySelector('.progress-fill').classList.add('done');
                
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url; a.download = `${zipName}.zip`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                
                update('✅ 完成');
                setTimeout(() => taskEl.remove(), 5000);
            } catch (e) {
                taskEl.querySelector('.progress-fill').classList.add('error');
                update('❌ 失败: ' + e.message);
            }
        }

        async function renameFolder(folderPath) {
            const oldName = folderPath.split('/').pop();
            const parentPath = folderPath.substring(0, folderPath.length - oldName.length - (folderPath.includes('/') ? 1 : 0));
            
            const newName = await showModal({ 
                type: 'prompt', title: '重命名文件夹', 
                message: `当前名称：${oldName}`, defaultValue: oldName 
            });
            if (!newName || !newName.trim() || newName === oldName) return;
            const trimmed = newName.trim();
            if (trimmed.includes('/') || trimmed.includes('\\')) {
                await showModal({ type: 'alert', title: '错误', message: '文件夹名称不能包含 / 或 \\' });
                return;
            }
            
            const newPath = parentPath ? `${parentPath}/${trimmed}` : trimmed;
            if (metadata.folders.includes(newPath)) {
                await showModal({ type: 'alert', title: '错误', message: '该名称的文件夹已存在' });
                return;
            }
            
            metadata.folders = metadata.folders.map(f => {
                if (f === folderPath) return newPath;
                if (f.startsWith(folderPath + '/')) return newPath + f.substring(folderPath.length);
                return f;
            });
            
            const affectedFiles = Object.values(globalFiles).filter(f => 
                f.folderPath === folderPath || f.folderPath.startsWith(folderPath + '/')
            );
            
            for (const file of affectedFiles) {
                const newFolderPath = newPath + file.folderPath.substring(folderPath.length);
                const newFolderPrefix = newFolderPath
                    ? newFolderPath.split('/').filter(p => p).map(p => encodeBaseName(p)).join('__') + '___'
                    : '';
                const newBaseName = `F_${newFolderPrefix}${encodeBaseName(file.fileName)}_${file.timestamp}`;
                try {
                    await fetch(`${WORKER_URL}/rename?oldPrefix=${encodeURIComponent(file.baseName)}&newPrefix=${encodeURIComponent(newBaseName)}`, {
                        method: 'POST'
                    });
                } catch (e) { console.error(e); }
            }
            
            await saveMetadata();
            await loadFiles();
        }

        async function deleteFolder(folderPath) {
            const filesInFolder = Object.values(globalFiles).filter(f => 
                f.folderPath === folderPath || f.folderPath.startsWith(folderPath + '/')
            );
            const subFoldersCount = metadata.folders.filter(f => f.startsWith(folderPath + '/')).length;
            
            const confirmed = await showModal({ 
                type: 'confirm', title: '确认删除文件夹', 
                message: `「${folderPath}」中包含 ${filesInFolder.length} 个文件，${subFoldersCount} 个子文件夹。删除后所有内容都将丢失，确定继续？` 
            });
            if (!confirmed) return;
            
            for (const file of filesInFolder) {
                try {
                    await fetch(`${WORKER_URL}/delete?prefix=${encodeURIComponent(file.baseName)}`, { method: 'DELETE' });
                } catch (e) { console.error(e); }
            }
            
            metadata.folders = metadata.folders.filter(f => f !== folderPath && !f.startsWith(folderPath + '/'));
            await saveMetadata();
            await loadFiles();
        }

        async function downloadFolder(folderPath) {
            const folderName = folderPath.split('/').pop();
            
            const files = Object.values(globalFiles).filter(f => 
                f.folderPath === folderPath || f.folderPath.startsWith(folderPath + '/')
            );
            
            if (files.length === 0) {
                await showModal({ type: 'alert', title: '提示', message: '文件夹为空' });
                return;
            }
            
            const totalSize = files.reduce((sum, f) => sum + f.parts.reduce((s, p) => s + p.size, 0), 0);
            
            const confirmed = await showModal({
                type: 'confirm',
                title: '打包下载',
                message: `「${folderName}」包含 ${files.length} 个文件，共 ${formatBytes(totalSize)}。开始打包下载？`
            });
            if (!confirmed) return;
            
            const taskId = 'dl-folder-' + Date.now();
            const taskEl = document.createElement('div');
            taskEl.className = 'task-item';
            taskEl.id = taskId;
            taskEl.innerHTML = `
                <div class="task-header">
                    <span class="task-name">📦 ${esc(folderName)}.zip</span>
                    <span class="task-meta"><span class="task-status">准备中...</span></span>
                </div>
                <div class="progress-bg"><div class="progress-fill"></div></div>
            `;
            document.getElementById('uploadQueue').appendChild(taskEl);
            
            const updateStatus = (text, percent) => {
                taskEl.querySelector('.task-status').innerText = text;
                if (percent !== undefined) {
                    taskEl.querySelector('.progress-fill').style.width = percent + '%';
                }
            };
            
            try {
                const zip = new JSZip();
                let downloadedBytes = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const relPath = file.folderPath.substring(folderPath.length).replace(/^\//, '');
                    const pathInZip = relPath ? `${relPath}/${file.fileName}` : file.fileName;
                    
                    updateStatus(`下载中 (${i + 1}/${files.length}) ${file.fileName}`, (downloadedBytes / totalSize) * 100);
                    
                    const link = `${WORKER_URL}/dl/${currentUserHash}/${file.baseName}/${encodeURIComponent(file.fileName)}?download=1`;
                    const resp = await fetch(link);
                    if (!resp.ok) throw new Error(`下载失败: ${file.fileName}`);
                    
                    const blob = await resp.blob();
                    zip.file(pathInZip, blob);
                    
                    downloadedBytes += blob.size;
                    updateStatus(`已下载 ${i + 1}/${files.length}`, (downloadedBytes / totalSize) * 100);
                }
                
                updateStatus('压缩中...', 100);
                taskEl.querySelector('.progress-fill').classList.add('done');
                
                const zipBlob = await zip.generateAsync(
                    { type: 'blob', compression: 'STORE' },
                    (meta) => {
                        updateStatus(`打包中 ${meta.percent.toFixed(0)}%`);
                    }
                );
                
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${folderName}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                
                updateStatus('✅ 完成');
                setTimeout(() => taskEl.remove(), 5000);
                
            } catch (e) {
                taskEl.querySelector('.progress-fill').classList.add('error');
                updateStatus('❌ 失败: ' + e.message);
                await showModal({ type: 'alert', title: '失败', message: e.message });
            }
        }

        window.downloadFolder = downloadFolder;

        // ======================= 初始化 =======================
        document.getElementById('tabLogin').onclick = () => switchAuthMode('login');
        document.getElementById('tabRegister').onclick = () => switchAuthMode('register');
        document.getElementById('loginBtn').onclick = doAuth;

        document.getElementById('loginEmail').onkeydown = (e) => {
            if (e.key === 'Enter') document.getElementById('loginPassword').focus();
        };
        document.getElementById('loginPassword').onkeydown = (e) => {
            if (e.key === 'Enter') {
                if (authMode === 'register') {
                    document.getElementById('loginInviteCode').focus();
                } else {
                    doAuth();
                }
            }
        };
        document.getElementById('loginInviteCode').onkeydown = (e) => {
            if (e.key === 'Enter') doAuth();
        };

        initUploadHandlers();
        initSearch();

        // ======================= 公开分享模式 =======================
        function checkShareMode() {
            const urlParams = new URLSearchParams(location.search);
            const shareUserHash = urlParams.get('share');
            const sharePath = urlParams.get('path');
            if (!shareUserHash) return null;
            
            let folderPath = '';
            if (sharePath) {
                try {
                    const b64 = sharePath.replace(/-/g, '+').replace(/_/g, '/');
                    const pad = b64.length % 4 ? '='.repeat(4 - b64.length % 4) : '';
                    const bin = atob(b64 + pad);
                    const bytes = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                    folderPath = new TextDecoder().decode(bytes);
                } catch (e) {
                    console.error('解析分享路径失败', e);
                }
            }
            return { userHash: shareUserHash, folderPath };
        }

        async function enterShareMode(shareInfo) {
            // 隐藏登录界面，显示主界面
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            
            // 设置全局变量（用别人的 userHash）
            currentUserHash = shareInfo.userHash;
            currentEmail = '👤 公开分享';
            
            // 🔧 关键改动：currentFolder 设为分享文件夹的"父级"
            // 这样分享的文件夹本身会作为一个条目显示
            const sharePath = shareInfo.folderPath;
            if (sharePath && sharePath.includes('/')) {
                currentFolder = sharePath.substring(0, sharePath.lastIndexOf('/'));
            } else {
                currentFolder = ''; // 父级是根目录
            }
            
            // 记录分享根目录（用于限制访问范围）
            window.__shareRoot = sharePath;
            
            // 顶部 UI 改造
            const headerRight = document.querySelector('h1 > span:last-child');
            if (headerRight) {
                const folderName = sharePath ? sharePath.split('/').pop() : '根目录';
                headerRight.innerHTML = `
                    <span style="color: var(--accent);">📤 共享：${esc(folderName)}</span>
                `;
            }
            
            // 隐藏上传区
            const boxes = document.querySelectorAll('.box');
            if (boxes[0]) boxes[0].style.display = 'none';
            
            // 列表操作栏：去掉"新建文件夹"按钮
            const listHeader = document.querySelector('.list-header');
            if (listHeader) {
                const buttons = listHeader.querySelectorAll('button');
                buttons.forEach(b => {
                    if (b.innerText.includes('新建文件夹')) b.style.display = 'none';
                });
            }
            
            // 加载公开数据
            await loadPublicFiles();
        }

        async function loadPublicFiles() {
            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            
            try {
                // 加载公开元数据
                const metaResp = await _fetch(`${WORKER_URL}/public/metadata/${currentUserHash}?t=${Date.now()}`);
                metadata = await metaResp.json();
                if (!metadata.folders) metadata.folders = [];
                
                // 加载公开文件列表
                const response = await _fetch(`${WORKER_URL}/public/list/${currentUserHash}?t=${Date.now()}`);
                if (!response.ok) throw new Error('加载失败');
                const assets = await response.json();
                
                globalFiles = {};
                assets.forEach(asset => {
                    if (asset.name === METADATA_FILENAME) return;
                    if (!asset.name.startsWith('F_')) return;
                    
                    const m = asset.name.match(/^(F_.+)\.part(\d+)$/);
                    if (!m) return;
                    const baseName = m[1];
                    const partNum = parseInt(m[2]);
                    
                    let folderPath = '';
                    let nameEncoded = '';
                    let timestamp = 0;
                    
                    const stripped = baseName.substring(2);
                    const folderSep = stripped.indexOf('___');
                    let rest = stripped;
                    if (folderSep !== -1) {
                        folderPath = stripped.substring(0, folderSep)
                            .split('__')
                            .map(p => decodeBaseName(p))
                            .join('/');
                        rest = stripped.substring(folderSep + 3);
                    }
                    const lastUnderscore = rest.lastIndexOf('_');
                    if (lastUnderscore !== -1) {
                        nameEncoded = rest.substring(0, lastUnderscore);
                        timestamp = parseInt(rest.substring(lastUnderscore + 1)) || 0;
                    } else {
                        nameEncoded = rest;
                    }
                    
                    let fileName;
                    try { fileName = decodeBaseName(nameEncoded); }
                    catch (e) { fileName = nameEncoded; }
                    
                    const fullPath = (folderPath ? folderPath + '/' : '') + fileName + '|' + baseName;
                    
                    if (!globalFiles[fullPath]) {
                        globalFiles[fullPath] = {
                            fullPath, fileName, folderPath, baseName, timestamp,
                            parts: []
                        };
                    }
                    globalFiles[fullPath].parts.push({ id: asset.id, name: asset.name, size: asset.size, partNum });
                });
                
                Object.values(globalFiles).forEach(f => f.parts.sort((a, b) => a.partNum - b.partNum));
                renderPublicFileList();
            } catch (e) {
                listEl.innerHTML = `<div class="empty-state">❌ 加载失败: ${esc(e.message)}</div>`;
            }
        }

        function renderPublicFileList() {
            updateBreadcrumbNavPublic();
            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '';

            const shareRoot = window.__shareRoot || '';
            
            if (shareRoot && currentFolder !== '' && 
                currentFolder !== shareRoot.substring(0, shareRoot.lastIndexOf('/')) &&
                currentFolder !== shareRoot &&
                !currentFolder.startsWith(shareRoot + '/')) {
                currentFolder = shareRoot.includes('/') ? shareRoot.substring(0, shareRoot.lastIndexOf('/')) : '';
            }

            const subFolders = new Set();
            metadata.folders.forEach(folder => {
                if (folder !== shareRoot && !folder.startsWith(shareRoot + '/')) {
                    return;
                }
                
                if (!currentFolder) {
                    const top = folder.split('/')[0];
                    if (top) subFolders.add(top);
                } else if (folder.startsWith(currentFolder + '/')) {
                    const rest = folder.substring(currentFolder.length + 1);
                    const top = rest.split('/')[0];
                    if (top) subFolders.add(currentFolder + '/' + top);
                }
            });

            const files = Object.values(globalFiles).filter(f => {
                if (f.folderPath !== currentFolder) return false;
                if (currentFolder !== shareRoot && !currentFolder.startsWith(shareRoot + '/') && shareRoot !== '') {
                    return false;
                }
                return true;
            });

            if (subFolders.size === 0 && files.length === 0) {
                listEl.innerHTML = '<div class="empty-state">此文件夹为空</div>';
                return;
            }

            // 渲染文件夹
            Array.from(subFolders).sort().forEach(folderPath => {
                const folderName = folderPath.split('/').pop();
                const item = document.createElement('div');
                item.className = 'folder-item';
                item.innerHTML = `
                    <span class="folder-icon">
                        <svg viewBox="0 0 24 24" style="width:22px;height:22px;"><path d="M10 4H4c-1.11 0-2 .89-2 2v12c0 1.097.903 2 2 2h16c1.097 0 2-.903 2-2V8c0-1.11-.9-2-2-2h-8l-2-2z"/></svg>
                    </span>
                    <span class="folder-name">${esc(folderName)}</span>
                    <span class="folder-meta">文件夹</span>
                    <div style="flex: 1;"></div>
                    <div class="file-actions">
                        <button class="icon-btn" title="点击下载，右键复制链接" data-act="download-folder">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </button>
                    </div>
                `;
                item.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    if (folderPath === shareRoot || folderPath.startsWith(shareRoot + '/') || shareRoot === '') {
                        currentFolder = folderPath;
                        renderPublicFileList();
                    }
                };
                
                const dlFolderBtn = item.querySelector('[data-act="download-folder"]');
                dlFolderBtn.onclick = (e) => { 
                    e.stopPropagation(); 
                    downloadFolder(folderPath); 
                };
                dlFolderBtn.oncontextmenu = async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const utf8 = new TextEncoder().encode(folderPath);
                    let bin = '';
                    utf8.forEach(b => bin += String.fromCharCode(b));
                    const folderB64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                    const shareUrl = `${location.origin}${location.pathname}?share=${currentUserHash}&path=${folderB64}`;
                    try {
                        await navigator.clipboard.writeText(shareUrl);
                        showToast('✅ 文件夹分享链接已复制');
                    } catch (err) {
                        await showModal({ type: 'alert', title: '链接（请手动复制）', message: shareUrl });
                    }
                };
                
                listEl.appendChild(item);
            });

            // 渲染文件
            files.forEach(file => {
                const timeString = file.timestamp ? new Date(file.timestamp).toLocaleString('zh-CN', { hour12: false }) : '未知时间';
                const totalSize = file.parts.reduce((sum, p) => sum + p.size, 0);
                
                const item = document.createElement('div');
                item.className = "file-item";
                item.innerHTML = `
                    <div class="file-info" style="margin-left: 0;">
                        <span class="file-name">${esc(file.fileName)}</span>
                        <span class="file-meta">${timeString} • ${formatBytes(totalSize)}</span>
                    </div>
                    <div class="file-actions">
                        <button class="icon-btn" title="左键预览，右键复制预览链接" data-act="preview-link">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                        <button class="icon-btn" title="左键下载，右键复制下载链接" data-act="download">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </button>
                    </div>
                `;

                const previewBtn = item.querySelector('[data-act="preview-link"]');
                previewBtn.onclick = () => openFileLink(file.baseName, file.fileName, 'preview');
                previewBtn.oncontextmenu = (e) => {
                    e.preventDefault();
                    copyFileLink(file.baseName, file.fileName, 'preview');
                };

                const downloadBtn = item.querySelector('[data-act="download"]');
                downloadBtn.onclick = () => openFileLink(file.baseName, file.fileName, 'download');
                downloadBtn.oncontextmenu = (e) => {
                    e.preventDefault();
                    copyFileLink(file.baseName, file.fileName, 'download');
                };

                listEl.appendChild(item);
            });
        }

        function updateBreadcrumbNavPublic() {
            const el = document.getElementById('breadcrumbNav');
            const shareRoot = window.__shareRoot || '';
            const shareRootParent = shareRoot.includes('/') ? shareRoot.substring(0, shareRoot.lastIndexOf('/')) : '';
            
            // 在分享根的父级（首页视图）
            if (currentFolder === shareRootParent) {
                el.innerHTML = '<span class="breadcrumb-item current">📤 共享内容</span>';
                return;
            }
            
            // 已进入文件夹
            // 计算从 shareRoot 开始的相对路径
            const fullParts = currentFolder.split('/');
            const shareRootParts = shareRoot ? shareRoot.split('/') : [];
            
            // 找到从哪一段开始显示
            let displayStartIdx = 0;
            if (shareRoot.includes('/')) {
                // shareRootParent 之后开始显示
                displayStartIdx = shareRootParent.split('/').length;
            }
            
            let html = '<span class="breadcrumb-item" data-target="root">📤 共享内容</span>';
            let path = shareRootParent;
            
            for (let i = displayStartIdx; i < fullParts.length; i++) {
                const part = fullParts[i];
                path = path ? `${path}/${part}` : part;
                const isLast = (i === fullParts.length - 1);
                html += '<span class="breadcrumb-separator">/</span>';
                html += `<span class="breadcrumb-item ${isLast ? 'current' : ''}" data-path="${esc(path)}">${esc(part)}</span>`;
            }
            
            el.innerHTML = html;
            el.querySelectorAll('.breadcrumb-item:not(.current)').forEach(node => {
                node.onclick = () => {
                    if (node.dataset.target === 'root') {
                        currentFolder = shareRootParent;
                    } else {
                        currentFolder = node.dataset.path;
                    }
                    renderPublicFileList();
                };
            });
        }

        window.onload = async () => {
            // 检测公开分享模式
            const shareInfo = checkShareMode();
            if (shareInfo) {
                await enterShareMode(shareInfo);
                return;
            }
            
            const ok = await checkLogin();
            if (ok) {
                hideLogin();
                loadFiles();
                updateUploadPathDisplay();
            } else {
                showLogin();
            }
        };
    </script>
</body>
