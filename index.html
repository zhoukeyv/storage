<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Storage</title>
    <style>
        :root {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --item-bg: #282828;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --border: #333;
            --success: #10b981;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); max-width: 900px; margin: 40px auto; padding: 20px; }
        h1 { font-weight: 500; margin-bottom: 30px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        h3 { font-weight: 500; font-size: 16px; margin-top: 0; margin-bottom: 16px; color: #fff; }
        .box { background: var(--box-bg); padding: 24px; border-radius: 8px; margin-bottom: 24px; border: 1px solid var(--border); }
        button, .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .dropzone { border: 2px dashed var(--border); border-radius: 8px; padding: 40px 20px; text-align: center; color: var(--text-muted); cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.02); }
        .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); color: var(--accent); }
        .queue-container { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        .task-item { background: var(--item-bg); padding: 12px 16px; border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .task-header { display: flex; justify-content: space-between; font-size: 14px; }
        .task-name { font-weight: 500; word-break: break-all; }
        .task-meta { color: var(--text-muted); font-size: 13px; display: flex; gap: 12px; }
        .task-status { font-variant-numeric: tabular-nums; }
        .progress-bg { width: 100%; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s ease-out; }
        .progress-fill.done { background: var(--success); }
        .progress-fill.error { background: var(--danger); }
        .upload-path-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 6px; flex-wrap: wrap; }
        .upload-path-selector label { color: var(--text-muted); font-size: 14px; }
        .path-display { font-size: 14px; color: var(--accent); font-weight: 500; padding: 4px 8px; background: rgba(59, 130, 246, 0.1); border-radius: 4px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
        .folder-item { display: flex; align-items: center; background: var(--item-bg); padding: 16px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .folder-item:hover { border-color: #555; background: rgba(255,255,255,0.03); }
        .folder-icon { margin-right: 12px; color: #fbbf24; }
        .folder-name { font-size: 15px; font-weight: 500; }
        .folder-meta { font-size: 12px; color: var(--text-muted); margin-left: 12px; }
        .file-item { display: flex; align-items: center; background: var(--item-bg); padding: 16px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border); transition: border-color 0.2s; }
        .file-item:hover { border-color: #555; }
        .file-item.selected { border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
        .file-checkbox { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; margin-right: 14px; border: 1.5px solid #555; border-radius: 4px; background: transparent; cursor: pointer; position: relative; transition: all 0.15s ease; flex-shrink: 0; }
        .file-checkbox:hover { border-color: var(--accent); }
        .file-checkbox:checked { background: var(--accent); border-color: var(--accent); }
        .file-checkbox:checked::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .file-info { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
        .file-name { font-size: 15px; font-weight: 500; word-break: break-all; }
        .file-meta { font-size: 12px; color: var(--text-muted); }
        .file-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .icon-btn { background: transparent; padding: 8px; border-radius: 6px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .icon-btn.delete:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        svg { width: 18px; height: 18px; fill: currentColor; }
        .status { color: var(--text-muted); font-size: 13px; }
        .batch-actions { display: none; gap: 10px; margin-bottom: 16px; padding: 12px; background: rgba(59, 130, 246, 0.1); border-radius: 6px; border: 1px solid var(--accent); }
        .batch-actions.show { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .breadcrumb-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 6px; font-size: 14px; flex-wrap: wrap; }
        .breadcrumb-item { color: var(--accent); cursor: pointer; transition: opacity 0.2s; }
        .breadcrumb-item:hover { opacity: 0.8; text-decoration: underline; }
        .breadcrumb-item.current { color: var(--text-main); cursor: default; }
        .breadcrumb-item.current:hover { opacity: 1; text-decoration: none; }
        .breadcrumb-separator { color: var(--text-muted); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--box-bg); padding: 24px; border-radius: 8px; width: 380px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .modal-message { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; word-break: break-all; white-space: pre-wrap; }
        .modal-input { width: 100%; box-sizing: border-box; background: var(--bg-color); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 20px; outline: none; }
        .modal-input:focus { border-color: var(--accent); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }

        /* 登录界面 */
        .login-screen {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        .login-screen .box { width: 380px; max-width: 90%; }
        .login-row { margin-bottom: 16px; }
        .login-row label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; }
        .login-row input { width: 100%; box-sizing: border-box; background: var(--bg-color); border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; outline: none; }
        .login-row input:focus { border-color: var(--accent); }
        .login-code-row { display: flex; gap: 8px; }
        .login-code-row input { flex: 1; }
        .login-msg { margin-top: 12px; font-size: 13px; min-height: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/streamsaver@2.0.6/StreamSaver.min.js"></script>
</head>
<body>

    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen" style="display: none;">
        <div class="box">
            <h3>🔐 登录 Storage</h3>
            <div class="login-row">
                <label>邮箱</label>
                <input id="loginEmail" type="email" placeholder="your@email.com">
            </div>
            <div class="login-row">
                <label>验证码</label>
                <div class="login-code-row">
                    <input id="loginCode" type="text" placeholder="6 位数字" maxlength="6">
                    <button id="sendCodeBtn" class="btn-secondary" style="white-space: nowrap;">发送</button>
                </div>
            </div>
            <button id="loginBtn" class="btn" style="width: 100%;">登 录</button>
            <div id="loginMsg" class="login-msg"></div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" style="display: none;">
        <h1>
            <span>Storage</span>
            <span style="font-size: 13px; color: var(--text-muted); font-weight: normal;">
                <span id="currentUser"></span>
                <button class="btn-secondary" onclick="logout()" style="margin-left: 12px; font-size: 13px; padding: 4px 12px;">退出</button>
            </span>
        </h1>

        <!-- 上传 -->
        <div class="box">
            <h3>上传文件</h3>
            <div class="upload-path-selector">
                <label>上传到：</label>
                <div id="uploadPathDisplay" class="path-display">/</div>
                <button class="btn-secondary" style="padding: 4px 12px; font-size: 13px;" onclick="showNewFolderDialog()">
                    + 新建文件夹
                </button>
            </div>
            <div id="dropzone" class="dropzone">点击选择文件 / 文件夹，或拖拽到此处</div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn-secondary" style="flex:1;" onclick="document.getElementById('fileInput').click()">📄 选择文件</button>
                <button class="btn-secondary" style="flex:1;" onclick="document.getElementById('folderInput').click()">📁 选择文件夹</button>
            </div>
            <input type="file" id="fileInput" multiple style="display: none;">
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
            <button id="startUploadBtn" class="btn" style="width: 100%; margin-top: 16px; display: none;">开始统一传输</button>
            <div id="uploadQueue" class="queue-container"></div>
        </div>

        <!-- 文件列表 -->
        <div class="box">
            <div class="list-header">
                <h3 style="margin: 0;">云端文件</h3>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span id="downloadStatus" class="status"></span>
                    <button class="btn-secondary" onclick="showNewFolderDialog()">新建文件夹</button>
                    <button class="btn-secondary" onclick="loadFiles()">刷新</button>
                </div>
            </div>
            <div id="breadcrumbNav" class="breadcrumb-nav">
                <span class="breadcrumb-item current">根目录</span>
            </div>
            <div id="batchActions" class="batch-actions">
                <span id="selectedCount">已选择 0 个文件</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn" onclick="batchDownload()">批量下载</button>
                    <button class="btn-danger" onclick="batchDelete()">批量删除</button>
                </div>
            </div>
            <div id="fileList"></div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalMessage" class="modal-message"></div>
            <input type="text" id="modalInput" class="modal-input" style="display: none;">
            <div class="modal-actions">
                <button id="modalBtnCancel" class="btn-secondary">取消</button>
                <button id="modalBtnConfirm" class="btn">确定</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://drive-proxy.coder1232026.workers.dev";
        const CHUNK_SIZE = 20 * 1024 * 1024;
        const METADATA_FILENAME = 'SYSTEM_FOLDER_METADATA';

        // ======================= 鉴权 =======================
        let authToken = localStorage.getItem('authToken') || '';
        let currentEmail = '';
        let currentUserHash = '';

        const _fetch = window.fetch.bind(window);
        window.fetch = function(url, options = {}) {
            if (typeof url === 'string' && url.startsWith(WORKER_URL) && authToken) {
                options.headers = options.headers || {};
                if (!options.headers['Authorization']) {
                    options.headers['Authorization'] = `Bearer ${authToken}`;
                }
            }
            return _fetch(url, options);
        };

        async function checkLogin() {
            if (!authToken) return false;
            try {
                const resp = await _fetch(`${WORKER_URL}/auth/check`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!resp.ok) return false;
                const data = await resp.json();
                if (data.loggedIn) {
                    currentEmail = data.email;
                    const meResp = await _fetch(`${WORKER_URL}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    currentUserHash = (await meResp.json()).userHash;
                    document.getElementById('currentUser').innerText = data.email;
                    return true;
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }
        function hideLogin() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        async function sendLoginCode() {
            const email = document.getElementById('loginEmail').value.trim();
            const msgEl = document.getElementById('loginMsg');
            const btn = document.getElementById('sendCodeBtn');
            if (!email) { msgEl.innerText = '请输入邮箱'; msgEl.style.color = 'var(--danger)'; return; }
            
            btn.disabled = true;
            msgEl.innerText = '发送中...';
            msgEl.style.color = 'var(--text-muted)';
            
            try {
                const resp = await _fetch(`${WORKER_URL}/auth/send-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || '发送失败');
                msgEl.innerText = '✅ 验证码已发送到邮箱（请检查收件箱/垃圾箱）';
                msgEl.style.color = 'var(--success)';
                
                let countdown = 60;
                btn.innerText = `${countdown}s`;
                const timer = setInterval(() => {
                    countdown--;
                    if (countdown < 0) {
                        clearInterval(timer);
                        btn.innerText = '发送';
                        btn.disabled = false;
                    } else {
                        btn.innerText = `${countdown}s`;
                    }
                }, 1000);
            } catch (e) {
                msgEl.innerText = '❌ ' + e.message;
                msgEl.style.color = 'var(--danger)';
                btn.disabled = false;
            }
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const msgEl = document.getElementById('loginMsg');
            if (!email || !code) { msgEl.innerText = '请填写邮箱和验证码'; msgEl.style.color = 'var(--danger)'; return; }
            
            msgEl.innerText = '登录中...';
            msgEl.style.color = 'var(--text-muted)';
            
            try {
                const resp = await _fetch(`${WORKER_URL}/auth/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || '登录失败');
                
                authToken = data.token;
                currentEmail = data.email;
                localStorage.setItem('authToken', authToken);
                // 🆕 获取 userHash
                const meResp = await _fetch(`${WORKER_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                currentUserHash = (await meResp.json()).userHash;
                msgEl.innerText = '✅ 登录成功';
                msgEl.style.color = 'var(--success)';
                
                setTimeout(() => {
                    document.getElementById('currentUser').innerText = data.email;
                    hideLogin();
                    loadFiles();
                    updateUploadPathDisplay();
                }, 500);
            } catch (e) {
                msgEl.innerText = '❌ ' + e.message;
                msgEl.style.color = 'var(--danger)';
            }
        }

        async function logout() {
            try {
                await _fetch(`${WORKER_URL}/auth/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
            } catch (e) {}
            authToken = '';
            localStorage.removeItem('authToken');
            location.reload();
        }

        window.logout = logout;

        // ======================= 工具函数 =======================
        function encodeBaseName(str) {
            const utf8 = new TextEncoder().encode(str);
            let bin = '';
            utf8.forEach(b => bin += String.fromCharCode(b));
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }
        function decodeBaseName(encoded) {
            let b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }
        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        function safeId(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
            return 'f' + Math.abs(h).toString(36);
        }
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ======================= 弹窗 / Toast =======================
        function showModal({ type, title, message, defaultValue = '' }) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customModal');
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalMessage').innerText = message;
                const inputEl = document.getElementById('modalInput');
                const btnCancel = document.getElementById('modalBtnCancel');
                
                if (type === 'prompt') { 
                    inputEl.style.display = 'block'; 
                    inputEl.value = defaultValue;
                    setTimeout(() => inputEl.focus(), 100);
                } else { 
                    inputEl.style.display = 'none'; 
                }
                btnCancel.style.display = (type === 'alert') ? 'none' : 'block';
                overlay.style.display = 'flex';

                const close = () => { overlay.style.display = 'none'; };
                btnCancel.onclick = () => { close(); resolve(null); };
                document.getElementById('modalBtnConfirm').onclick = () => { 
                    close(); 
                    resolve(type === 'prompt' ? inputEl.value : true); 
                };
                inputEl.onkeydown = (e) => {
                    if (e.key === 'Enter') { close(); resolve(inputEl.value); }
                };
            });
        }

        function showToast(msg) {
            let toast = document.getElementById('__toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = '__toast';
                toast.style.cssText = `
                    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                    background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px;
                    border-radius: 6px; font-size: 14px; z-index: 9999;
                    opacity: 0; transition: opacity 0.3s; pointer-events: none;
                    border: 1px solid #333;
                `;
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            toast.style.opacity = '1';
            clearTimeout(toast._t);
            toast._t = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }

        // ======================= 链接 =======================
        function getFileLink(baseName, fileName, mode) {
            let link = `${WORKER_URL}/dl/${currentUserHash}/${baseName}/${encodeURIComponent(fileName)}`;
            if (mode === 'download') link += '?download=1';
            return link;
        }
        function openFileLink(baseName, fileName, mode) {
            window.open(getFileLink(baseName, fileName, mode), '_blank');
        }
        async function copyFileLink(baseName, fileName, mode) {
            const link = getFileLink(baseName, fileName, mode);
            try {
                await navigator.clipboard.writeText(link);
                showToast(mode === 'preview' ? '✅ 预览链接已复制' : '✅ 下载链接已复制');
            } catch (e) {
                await showModal({ type: 'alert', title: '链接（请手动复制）', message: link });
            }
        }
        window.openFileLink = openFileLink;
        window.copyFileLink = copyFileLink;

        // ======================= 元数据 =======================
        let metadata = { folders: [] };

        async function loadMetadata() {
            try {
                const response = await fetch(`${WORKER_URL}/metadata?t=${Date.now()}`);
                metadata = await response.json();
                if (!metadata.folders) metadata.folders = [];
            } catch (err) {
                console.error('加载元数据失败:', err);
                metadata = { folders: [] };
            }
        }
        async function saveMetadata() {
            await fetch(`${WORKER_URL}/metadata`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(metadata)
            });
        }

        // ======================= 文件夹导航 =======================
        let currentFolder = '';

        function updateUploadPathDisplay() {
            document.getElementById('uploadPathDisplay').innerText = currentFolder ? `/${currentFolder}/` : '/';
        }
        function updateBreadcrumbNav() {
            const el = document.getElementById('breadcrumbNav');
            if (!currentFolder) {
                el.innerHTML = '<span class="breadcrumb-item current">根目录</span>';
                return;
            }
            const parts = currentFolder.split('/');
            let html = '<span class="breadcrumb-item" data-path="">根目录</span>';
            let path = '';
            parts.forEach((part, i) => {
                path += (i > 0 ? '/' : '') + part;
                const isLast = (i === parts.length - 1);
                html += `<span class="breadcrumb-separator">/</span>`;
                html += `<span class="breadcrumb-item ${isLast ? 'current' : ''}" data-path="${esc(path)}">${esc(part)}</span>`;
            });
            el.innerHTML = html;
            el.querySelectorAll('.breadcrumb-item:not(.current)').forEach(node => {
                node.onclick = () => navigateToFolder(node.dataset.path);
            });
        }
        function navigateToFolder(folderPath) {
            currentFolder = folderPath;
            updateBreadcrumbNav();
            updateUploadPathDisplay();
            renderFileList();
        }

        async function showNewFolderDialog() {
            const folderName = await showModal({ type: 'prompt', title: '新建文件夹', message: '请输入文件夹名称：' });
            if (!folderName || !folderName.trim()) return;
            const trimmedName = folderName.trim();
            if (trimmedName.includes('/') || trimmedName.includes('\\')) {
                await showModal({ type: 'alert', title: '错误', message: '文件夹名称不能包含 / 或 \\' });
                return;
            }
            const newFolderPath = currentFolder ? `${currentFolder}/${trimmedName}` : trimmedName;
            if (metadata.folders.includes(newFolderPath)) {
                await showModal({ type: 'alert', title: '提示', message: '文件夹已存在！' });
                return;
            }
            metadata.folders.push(newFolderPath);
            await saveMetadata();
            renderFileList();
        }

        // ======================= 上传 =======================
        let uploadQueue = [];
        let isUploading = false;

        function initUploadHandlers() {
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            const folderInput = document.getElementById('folderInput');  // 🆕
            const startUploadBtn = document.getElementById('startUploadBtn');

            dropzone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => addFilesToQueue(e.target.files));
            folderInput.addEventListener('change', (e) => addFilesToQueue(e.target.files));  // 🆕
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
            dropzone.addEventListener('drop', async (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                
                const items = e.dataTransfer.items;
                if (items && items.length > 0 && items[0].webkitGetAsEntry) {
                    // 支持拖拽文件夹
                    const files = [];
                    const traverse = async (entry, path = '') => {
                        if (entry.isFile) {
                            const file = await new Promise(res => entry.file(res));
                            // 模拟 webkitRelativePath
                            Object.defineProperty(file, 'webkitRelativePath', {
                                value: path + entry.name
                            });
                            files.push(file);
                        } else if (entry.isDirectory) {
                            const reader = entry.createReader();
                            const entries = await new Promise(res => reader.readEntries(res));
                            for (const sub of entries) {
                                await traverse(sub, path + entry.name + '/');
                            }
                        }
                    };
                    
                    const entries = [];
                    for (const item of items) {
                        const entry = item.webkitGetAsEntry();
                        if (entry) entries.push(entry);
                    }
                    for (const entry of entries) {
                        await traverse(entry);
                    }
                    addFilesToQueue(files);
                } else {
                    // 回退到普通文件
                    addFilesToQueue(e.dataTransfer.files);
                }
            });

            startUploadBtn.addEventListener('click', async () => {
                if (uploadQueue.length === 0) return;
                isUploading = true;
                startUploadBtn.style.display = 'none';
                dropzone.style.pointerEvents = 'none';
                dropzone.innerText = "传输中，请勿关闭页面...";

                for (let task of uploadQueue) {
                    if (task.status === 'pending') await processSingleTask(task);
                }
                isUploading = false;
                dropzone.style.pointerEvents = 'auto';
                dropzone.innerText = "点击选择文件，或将多个文件拖拽到此处";
                uploadQueue = [];
                await showModal({ type: 'alert', title: '上传完毕', message: '所有文件已传输完成！' });
                setTimeout(() => { document.getElementById('uploadQueue').innerHTML = ''; loadFiles(); }, 500);
            });
        }

        function addFilesToQueue(files) {
            if (files.length === 0) return;
            const fileInput = document.getElementById('fileInput');
            const folderInput = document.getElementById('folderInput');
            const startUploadBtn = document.getElementById('startUploadBtn');
            const newFolders = new Set();

            Array.from(files).forEach(file => {
                const relPath = file.webkitRelativePath || file.name;
                // 🔧 严格过滤：去掉空段、. 和 ..
                const parts = relPath.split('/').filter(p => p && p !== '.' && p !== '..');
                const subFolderParts = parts.slice(0, -1);

                // 🔧 计算目标文件夹（严格判断）
                let targetFolder = currentFolder || '';
                if (subFolderParts.length > 0) {
                    const subPath = subFolderParts.join('/');
                    targetFolder = currentFolder ? `${currentFolder}/${subPath}` : subPath;

                    // 父级路径都记录
                    let acc = currentFolder || '';
                    for (const part of subFolderParts) {
                        acc = acc ? `${acc}/${part}` : part;
                        newFolders.add(acc);
                    }
                }

                // 🔧 最后再清理一次 targetFolder，确保不会有 . 段
                targetFolder = targetFolder
                    .split('/')
                    .filter(p => p && p !== '.' && p !== '..')
                    .join('/');

                const task = {
                    file,
                    status: 'pending',
                    uploaded: 0,
                    total: file.size,
                    domId: 'task-' + Math.random().toString(36).slice(2, 9),
                    folder: targetFolder
                };
                uploadQueue.push(task);

                const taskEl = document.createElement('div');
                taskEl.className = 'task-item';
                taskEl.id = task.domId;
                taskEl.innerHTML = `
                    <div class="task-header">
                        <span class="task-name">${esc(relPath)}</span>
                        <span class="task-meta">
                            <span style="color: var(--accent);">→ ${esc(targetFolder ? '/' + targetFolder + '/' : '/')}</span>
                            <span class="task-status">等待中</span>
                        </span>
                    </div>
                    <div class="progress-bg"><div class="progress-fill"></div></div>
                `;
                document.getElementById('uploadQueue').appendChild(taskEl);
            });

            if (newFolders.size > 0) {
                let changed = false;
                for (const folder of newFolders) {
                    // 🔧 同样过滤
                    const clean = folder.split('/').filter(p => p && p !== '.' && p !== '..').join('/');
                    if (clean && !metadata.folders.includes(clean)) {
                        metadata.folders.push(clean);
                        changed = true;
                    }
                }
                if (changed) saveMetadata().catch(console.error);
            }

            fileInput.value = '';
            if (folderInput) folderInput.value = '';
            startUploadBtn.style.display = 'block';
            startUploadBtn.innerText = `开始统一传输 (${uploadQueue.length} 个文件)`;
        }

        function updateTaskUI(task, statusText, isError = false, isDone = false) {
            const el = document.getElementById(task.domId);
            if (!el) return;
            const percent = task.total > 0 ? (task.uploaded / task.total) * 100 : 0;
            const fill = el.querySelector('.progress-fill');
            fill.style.width = percent + '%';
            fill.classList.toggle('done', isDone);
            fill.classList.toggle('error', isError);
            el.querySelector('.task-status').innerText = statusText;
        }

        async function processSingleTask(task) {
            const file = task.file;
            const timestamp = Date.now();
            const cleanFolder = (task.folder || '')
                .split('/')
                .filter(p => p && p !== '.' && p !== '..')
                .join('/');
            const folderPrefix = cleanFolder ? cleanFolder.replace(/\//g, '__') + '___' : '';
            const baseName = `F_${folderPrefix}${encodeBaseName(file.name)}_${timestamp}`;
            
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            task.uploaded = 0;
            updateTaskUI(task, `准备分块... (共 ${totalChunks} 块)`);

            try {
                for (let i = 0; i < totalChunks; i++) {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, file.size);
                    const chunk = file.slice(start, end);
                    const partName = `${baseName}.part${i + 1}`;
                    
                    await uploadChunkWithProgress(task, chunk, partName, i + 1, totalChunks);
                }
                updateTaskUI(task, `✅ 完成`, false, true);
                task.status = 'done';
            } catch (err) {
                console.error("Upload failed:", err);
                updateTaskUI(task, `❌ 失败: ${err.message}`, true, false);
                task.status = 'error';
            }
        }

        function uploadChunkWithProgress(task, chunk, partName, chunkIndex, totalChunks) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const startBytesUploaded = task.uploaded;

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        task.uploaded = startBytesUploaded + e.loaded;
                        const percent = ((task.uploaded / task.total) * 100).toFixed(1);
                        updateTaskUI(task, `${percent}% (块 ${chunkIndex}/${totalChunks})`);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        task.uploaded = startBytesUploaded + chunk.size;
                        resolve();
                    } else {
                        reject(new Error(`HTTP ${xhr.status}: ${xhr.responseText.substring(0,100)}`));
                    }
                };
                xhr.onerror = () => reject(new Error('网络错误'));
                xhr.onabort = () => reject(new Error('已取消'));

                xhr.open('POST', `${WORKER_URL}/upload?name=${encodeURIComponent(partName)}`);
                if (authToken) xhr.setRequestHeader('Authorization', `Bearer ${authToken}`);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                xhr.send(chunk);
            });
        }

        // ======================= 文件列表 =======================
        let globalFiles = {};
        let selectedFiles = new Set();

        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '<div class="empty-state">加载中...</div>';
            try {
                await loadMetadata();
                const response = await fetch(`${WORKER_URL}/list?t=${Date.now()}`);
                if (!response.ok) {
                    if (response.status === 401) {
                        showLogin();
                        return;
                    }
                    throw new Error('加载失败');
                }
                const assets = await response.json();
                
                globalFiles = {};
                assets.forEach(asset => {
                    if (asset.name === METADATA_FILENAME) return;
                    if (!asset.name.startsWith('F_')) return;
                    
                    const m = asset.name.match(/^(F_.+)\.part(\d+)$/);
                    if (!m) return;
                    const baseName = m[1];
                    const partNum = parseInt(m[2]);
                    
                    // 解析 F_<folderEncoded>___<nameEncoded>_<timestamp>
                    // 或 F_<nameEncoded>_<timestamp>
                    let folderPath = '';
                    let nameEncoded = '';
                    let timestamp = 0;
                    
                    const stripped = baseName.substring(2); // 去掉 F_
                    const folderSep = stripped.indexOf('___');
                    let rest = stripped;
                    if (folderSep !== -1) {
                        folderPath = stripped.substring(0, folderSep).replace(/__/g, '/');
                        rest = stripped.substring(folderSep + 3);
                    }
                    // rest = <nameEncoded>_<timestamp>
                    const lastUnderscore = rest.lastIndexOf('_');
                    if (lastUnderscore !== -1) {
                        nameEncoded = rest.substring(0, lastUnderscore);
                        timestamp = parseInt(rest.substring(lastUnderscore + 1)) || 0;
                    } else {
                        nameEncoded = rest;
                    }
                    
                    let fileName;
                    try {
                        fileName = decodeBaseName(nameEncoded);
                    } catch (e) {
                        fileName = nameEncoded;
                    }
                    
                    const fullPath = (folderPath ? folderPath + '/' : '') + fileName + '|' + baseName;
                    
                    if (!globalFiles[fullPath]) {
                        globalFiles[fullPath] = {
                            fullPath, fileName, folderPath, baseName, timestamp,
                            parts: []
                        };
                    }
                    globalFiles[fullPath].parts.push({ id: asset.id, name: asset.name, size: asset.size, partNum });
                });
                
                Object.values(globalFiles).forEach(f => f.parts.sort((a, b) => a.partNum - b.partNum));
                renderFileList();
            } catch (e) {
                listEl.innerHTML = `<div class="empty-state">❌ 加载失败: ${esc(e.message)}</div>`;
            }
        }

        function renderFileList() {

            const listEl = document.getElementById('fileList');
            listEl.innerHTML = '';

            const subFolders = new Set();

                if (!currentFolder) {
                    const top = folder.split('/')[0];
                    if (top) subFolders.add(top);
                } else if (folder.startsWith(currentFolder + '/')) {
                    const rest = folder.substring(currentFolder.length + 1);
                    const top = rest.split('/')[0];
                    if (top) subFolders.add(currentFolder + '/' + top);
                }
            });

            // 当前文件夹的文件
            const files = Object.values(globalFiles).filter(f => f.folderPath === currentFolder);

                            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>

                item.querySelector('[data-act="download-folder"]').onclick = (e) => {

                    downloadFolder(folderPath);

                item.querySelector('[data-act="rename-folder"]').onclick = (e) => { e.stopPropagation(); renameFolder(folderPath); };
                item.querySelector('[data-act="delete-folder"]').onclick = (e) => { e.stopPropagation(); deleteFolder(folderPath); };
                listEl.appendChild(item);

            // 渲染文件
            files.forEach(file => {

                const totalSize = file.parts.reduce((sum, p) => sum + p.size, 0);
                
                const item = document.createElement('div');
                item.className = "file-item";
                item.innerHTML = `
                    <input type="checkbox" class="file-checkbox">
                    <div class="file-info">
                        <span class="file-name">${esc(file.fileName)}</span>
                        <span class="file-meta">${timeString} • ${file.parts.length} 个分块 • ${formatBytes(totalSize)}</span>
                    </div>
                    <div class="file-actions">
                        <button class="icon-btn" title="点击预览（右键复制链接）" data-act="preview-link">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                        <button class="icon-btn" title="点击下载（右键复制链接）" data-act="download">
                            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                        </button>
                        <button class="icon-btn" title="重命名" data-act="rename">
                            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                        </button>
                        <button class="icon-btn delete" title="删除" data-act="delete">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;

                item.querySelector('.file-checkbox').onchange = (e) => toggleFileSelection(file.fullPath, e.target.checked);

                const bind = (selector, handler) => {
                    const el = item.querySelector(selector);
                    if (el) el.onclick = handler;
                };
                const bindWithContext = (selector, leftClick, rightClick) => {
                    const el = item.querySelector(selector);
                    if (!el) return;
                    el.onclick = leftClick;
                    el.oncontextmenu = (e) => { e.preventDefault(); rightClick(); };
                };

                bindWithContext('[data-act="preview-link"]',
                    () => openFileLink(file.baseName, file.fileName, 'preview'),
                    () => copyFileLink(file.baseName, file.fileName, 'preview')
                );
                bindWithContext('[data-act="download"]',
                    () => openFileLink(file.baseName, file.fileName, 'download'),
                    () => copyFileLink(file.baseName, file.fileName, 'download')
                );
                bind('[data-act="rename"]', () => renameFile(file));
                bind('[data-act="delete"]', () => deleteFile(file));

                listEl.appendChild(item);
            });
        }

        // ======================= 文件操作 =======================
        function toggleFileSelection(fullPath, checked) {
            if (checked) selectedFiles.add(fullPath);
            else selectedFiles.delete(fullPath);
            updateBatchActions();
        }
        function updateBatchActions() {
            const el = document.getElementById('batchActions');
            const count = selectedFiles.size;
            if (count > 0) {
                el.classList.add('show');
                document.getElementById('selectedCount').innerText = `已选择 ${count} 个文件`;
            } else {
                el.classList.remove('show');
            }
        }

        async function renameFile(file) {
            const newName = await showModal({ 
                type: 'prompt', title: '重命名文件', 
                message: `当前名称：${file.fileName}`, defaultValue: file.fileName 
            });
            if (!newName || newName.trim() === '' || newName === file.fileName) return;
            
            const folderPrefix = file.folderPath ? file.folderPath.replace(/\//g, '__') + '___' : '';
            const newBaseName = `F_${folderPrefix}${encodeBaseName(newName.trim())}_${file.timestamp}`;
            
            try {
                const resp = await fetch(`${WORKER_URL}/rename?oldPrefix=${encodeURIComponent(file.baseName)}&newPrefix=${encodeURIComponent(newBaseName)}`, {
                    method: 'POST'
                });
                if (!resp.ok) throw new Error(await resp.text());
                await loadFiles();
            } catch (e) {
                await showModal({ type: 'alert', title: '失败', message: e.message });
            }
        }

        async function deleteFile(file) {
            const confirmed = await showModal({ 
                type: 'confirm', title: '确认删除', 
                message: `确定要删除「${file.fileName}」吗？此操作不可恢复。` 
            });
            if (!confirmed) return;
            
            try {
                const resp = await fetch(`${WORKER_URL}/delete?prefix=${encodeURIComponent(file.baseName)}`, {
                    method: 'DELETE'
                });
                if (!resp.ok) throw new Error(await resp.text());
                selectedFiles.delete(file.fullPath);
                updateBatchActions();
                await loadFiles();
            } catch (e) {
                await showModal({ type: 'alert', title: '失败', message: e.message });
            }
        }

        async function batchDelete() {
            if (selectedFiles.size === 0) return;
            const confirmed = await showModal({ 
                type: 'confirm', title: '批量删除', 
                message: `确定要删除选中的 ${selectedFiles.size} 个文件吗？此操作不可恢复。` 
            });
            if (!confirmed) return;
            
            for (const fullPath of selectedFiles) {
                const file = globalFiles[fullPath];
                if (!file) continue;
                try {
                    await fetch(`${WORKER_URL}/delete?prefix=${encodeURIComponent(file.baseName)}`, { method: 'DELETE' });
                } catch (e) { console.error(e); }
            }
            selectedFiles.clear();
            updateBatchActions();
            await loadFiles();
        }

        async function batchDownload() {
            if (selectedFiles.size === 0) return;
            const files = Array.from(selectedFiles).map(fullPath => globalFiles[fullPath]).filter(Boolean);
            
            // 文件数量多时建议打包
            let asZip = false;
            if (files.length >= 3) {
                const choice = await showModal({
                    type: 'confirm',
                    title: '批量下载方式',
                    message: `共 ${files.length} 个文件，确定 = 打包为 ZIP 下载，取消 = 分别下载`
                });
                asZip = !!choice;
            }
            
            selectedFiles.clear();
            updateBatchActions();
            document.querySelectorAll('.file-checkbox').forEach(cb => cb.checked = false);
            document.querySelectorAll('.file-item').forEach(item => item.classList.remove('selected'));
            
            if (asZip) {
                await downloadFilesAsZip(files, `download_${Date.now()}`);
            } else {
                files.forEach((f, i) => {
                    setTimeout(() => openFileLink(f.baseName, f.fileName, 'download'), i * 300);
                });
            }
        }

        // 通用打包函数（也供文件夹下载用）
        async function downloadFilesAsZip(files, zipName) {
            const totalSize = files.reduce((sum, f) => sum + f.parts.reduce((s, p) => s + p.size, 0), 0);
            
            const taskId = 'dl-zip-' + Date.now();
            const taskEl = document.createElement('div');
            taskEl.className = 'task-item';
            taskEl.id = taskId;
            taskEl.innerHTML = `
                <div class="task-header">
                    <span class="task-name">📦 ${esc(zipName)}.zip</span>
                    <span class="task-meta"><span class="task-status">准备中...</span></span>
                </div>
                <div class="progress-bg"><div class="progress-fill"></div></div>
            `;
            document.getElementById('uploadQueue').appendChild(taskEl);
            
            const update = (text, percent) => {
                taskEl.querySelector('.task-status').innerText = text;
                if (percent !== undefined) taskEl.querySelector('.progress-fill').style.width = percent + '%';
            };
            
            try {
                const zip = new JSZip();
                let downloaded = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    update(`下载 (${i+1}/${files.length}) ${file.fileName}`, (downloaded / totalSize) * 100);
                    
                    const link = `${WORKER_URL}/dl/${currentUserHash}/${file.baseName}/${encodeURIComponent(file.fileName)}?download=1`;
                    const resp = await fetch(link);
                    if (!resp.ok) throw new Error(`下载失败: ${file.fileName}`);
                    const blob = await resp.blob();
                    
                    // 保留路径
                    const pathInZip = file.folderPath ? `${file.folderPath}/${file.fileName}` : file.fileName;
                    zip.file(pathInZip, blob);
                    downloaded += blob.size;
                }
                
                const zipBlob = await zip.generateAsync(
                    { type: 'blob', compression: 'STORE' },
                    (meta) => update(`打包中 ${meta.percent.toFixed(0)}%`, 100)
                );
                
                taskEl.querySelector('.progress-fill').classList.add('done');
                
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url; a.download = `${zipName}.zip`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                
                update('✅ 完成');
                setTimeout(() => taskEl.remove(), 5000);
            } catch (e) {
                taskEl.querySelector('.progress-fill').classList.add('error');
                update('❌ 失败: ' + e.message);
            }
        }

        async function renameFolder(folderPath) {
            const oldName = folderPath.split('/').pop();
            const parentPath = folderPath.substring(0, folderPath.length - oldName.length - (folderPath.includes('/') ? 1 : 0));
            
            const newName = await showModal({ 
                type: 'prompt', title: '重命名文件夹', 
                message: `当前名称：${oldName}`, defaultValue: oldName 
            });
            if (!newName || !newName.trim() || newName === oldName) return;
            const trimmed = newName.trim();
            if (trimmed.includes('/') || trimmed.includes('\\')) {
                await showModal({ type: 'alert', title: '错误', message: '文件夹名称不能包含 / 或 \\' });
                return;
            }
            
            const newPath = parentPath ? `${parentPath}/${trimmed}` : trimmed;
            if (metadata.folders.includes(newPath)) {
                await showModal({ type: 'alert', title: '错误', message: '该名称的文件夹已存在' });
                return;
            }
            
            // 更新 metadata
            metadata.folders = metadata.folders.map(f => {
                if (f === folderPath) return newPath;
                if (f.startsWith(folderPath + '/')) return newPath + f.substring(folderPath.length);
                return f;
            });
            
            // 重命名该文件夹下所有文件的 prefix
            const affectedFiles = Object.values(globalFiles).filter(f => 
                f.folderPath === folderPath || f.folderPath.startsWith(folderPath + '/')
            );
            
            for (const file of affectedFiles) {
                const newFolderPath = newPath + file.folderPath.substring(folderPath.length);
                const newFolderPrefix = newFolderPath ? newFolderPath.replace(/\//g, '__') + '___' : '';
                const newBaseName = `F_${newFolderPrefix}${encodeBaseName(file.fileName)}_${file.timestamp}`;
                try {
                    await fetch(`${WORKER_URL}/rename?oldPrefix=${encodeURIComponent(file.baseName)}&newPrefix=${encodeURIComponent(newBaseName)}`, {
                        method: 'POST'
                    });
                } catch (e) { console.error(e); }
            }
            
            await saveMetadata();
            await loadFiles();
        }

        async function deleteFolder(folderPath) {
            const filesInFolder = Object.values(globalFiles).filter(f => 
                f.folderPath === folderPath || f.folderPath.startsWith(folderPath + '/')
            );
            const subFoldersCount = metadata.folders.filter(f => f.startsWith(folderPath + '/')).length;
            
            const confirmed = await showModal({ 
                type: 'confirm', title: '确认删除文件夹', 
                message: `「${folderPath}」中包含 ${filesInFolder.length} 个文件，${subFoldersCount} 个子文件夹。删除后所有内容都将丢失，确定继续？` 
            });
            if (!confirmed) return;
            
            for (const file of filesInFolder) {
                try {
                    await fetch(`${WORKER_URL}/delete?prefix=${encodeURIComponent(file.baseName)}`, { method: 'DELETE' });
                } catch (e) { console.error(e); }
            }
            
            metadata.folders = metadata.folders.filter(f => f !== folderPath && !f.startsWith(folderPath + '/'));
            await saveMetadata();
            await loadFiles();
        }

        async function downloadFolder(folderPath) {
            const folderName = folderPath.split('/').pop();
            
            // 收集该文件夹下所有文件（包括子文件夹）
            const files = Object.values(globalFiles).filter(f => 
                f.folderPath === folderPath || f.folderPath.startsWith(folderPath + '/')
            );
            
            if (files.length === 0) {
                await showModal({ type: 'alert', title: '提示', message: '文件夹为空' });
                return;
            }
            
            const totalSize = files.reduce((sum, f) => sum + f.parts.reduce((s, p) => s + p.size, 0), 0);
            
            const confirmed = await showModal({
                type: 'confirm',
                title: '打包下载',
                message: `「${folderName}」包含 ${files.length} 个文件，共 ${formatBytes(totalSize)}。开始打包下载？`
            });
            if (!confirmed) return;
            
            // 创建进度任务
            const taskId = 'dl-folder-' + Date.now();
            const taskEl = document.createElement('div');
            taskEl.className = 'task-item';
            taskEl.id = taskId;
            taskEl.innerHTML = `
                <div class="task-header">
                    <span class="task-name">📦 ${esc(folderName)}.zip</span>
                    <span class="task-meta"><span class="task-status">准备中...</span></span>
                </div>
                <div class="progress-bg"><div class="progress-fill"></div></div>
            `;
            document.getElementById('uploadQueue').appendChild(taskEl);
            
            const updateStatus = (text, percent) => {
                taskEl.querySelector('.task-status').innerText = text;
                if (percent !== undefined) {
                    taskEl.querySelector('.progress-fill').style.width = percent + '%';
                }
            };
            
            try {
                const zip = new JSZip();
                let downloadedBytes = 0;
                
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const relPath = file.folderPath.substring(folderPath.length).replace(/^\//, '');
                    const pathInZip = relPath ? `${relPath}/${file.fileName}` : file.fileName;
                    
                    updateStatus(`下载中 (${i + 1}/${files.length}) ${file.fileName}`, (downloadedBytes / totalSize) * 100);
                    
                    // 通过公开链接下载（包含所有分块合并后的完整文件）
                    const link = `${WORKER_URL}/dl/${currentUserHash}/${file.baseName}/${encodeURIComponent(file.fileName)}?download=1`;
                    const resp = await fetch(link);
                    if (!resp.ok) throw new Error(`下载失败: ${file.fileName}`);
                    
                    const blob = await resp.blob();
                    zip.file(pathInZip, blob);
                    
                    downloadedBytes += blob.size;
                    updateStatus(`已下载 ${i + 1}/${files.length}`, (downloadedBytes / totalSize) * 100);
                }
                
                updateStatus('压缩中...', 100);
                taskEl.querySelector('.progress-fill').classList.add('done');
                
                // 流式生成 ZIP 并保存
                const zipBlob = await zip.generateAsync(
                    { type: 'blob', compression: 'STORE' },  // STORE = 不压缩，速度快（文件本身已经压缩过的就不再压）
                    (meta) => {
                        updateStatus(`打包中 ${meta.percent.toFixed(0)}%`);
                    }
                );
                
                // 触发下载
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${folderName}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                
                updateStatus('✅ 完成');
                setTimeout(() => taskEl.remove(), 5000);
                
            } catch (e) {
                taskEl.querySelector('.progress-fill').classList.add('error');
                updateStatus('❌ 失败: ' + e.message);
                await showModal({ type: 'alert', title: '失败', message: e.message });
            }
        }

        window.downloadFolder = downloadFolder;

        // ======================= 初始化 =======================
        document.getElementById('sendCodeBtn').onclick = sendLoginCode;
        document.getElementById('loginBtn').onclick = doLogin;
        document.getElementById('loginCode').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
        document.getElementById('loginEmail').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('loginCode').focus(); };

        initUploadHandlers();

        window.onload = async () => {
            const ok = await checkLogin();
            if (ok) {
                hideLogin();
                loadFiles();
                updateUploadPathDisplay();
            } else {
                showLogin();
            }
        };
    </script>
</body>
</html>
