<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

<div id="app" class="max-w-4xl mx-auto">
    <div class="bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 flex justify-between items-center">
            Storage
            <div class="text-sm text-green-600 font-bold">✅ 已自动授权</div>
        </h1>

        <!-- 上传区域 -->
        <div class="mb-6 p-4 border-2 border-dashed border-gray-300 rounded-lg text-center bg-gray-50">
            <input type="file" ref="fileInput" class="hidden" @change="handleFileUpload">
            <button @click="$refs.fileInput.click()" class="bg-blue-500 text-white px-6 py-2 rounded shadow hover:bg-blue-600 transition" :disabled="uploading">
                {{ uploading ? '🚀 上传中 (大文件请耐心等待)...' : '点击选择文件上传' }}
            </button>
        </div>

        <!-- 文件列表 -->
        <h2 class="text-xl font-semibold mb-2 border-b pb-2 flex justify-between items-end">
            <span>文件列表</span>
            <span class="text-sm text-gray-500 font-normal">点击文件名即可高速下载</span>
        </h2>
        <p v-if="loading" class="text-gray-500">正在拉取文件列表...</p>
        
        <ul class="divide-y divide-gray-200">
            <li v-for="file in files" :key="file.id" class="py-3 flex justify-between items-center hover:bg-gray-50 transition">
                <div class="flex items-center space-x-3 px-2">
                    <span class="text-3xl">📄</span>
                    <div>
                        <!-- 直接触发原生高速下载 -->
                        <a :href="file.browser_download_url" class="text-blue-600 hover:underline font-medium text-lg" target="_blank">{{ file.name }}</a>
                        <p class="text-xs text-gray-500 mt-1">
                            大小: {{ (file.size / 1024 / 1024).toFixed(2) }} MB | 日期: {{ new Date(file.created_at).toLocaleString() }}
                        </p>
                    </div>
                </div>
            </li>
        </ul>
        <p v-if="files.length === 0 && !loading" class="text-center text-gray-500 py-8">仓库还是空的哦，快去上传文件吧！</p>
    </div>
</div>

<script>
    // ================= 配置区域 =================
    const GITHUB_OWNER = "zhoukeyv"; 
    const GITHUB_REPO = "storage";       
    // 已经为你做好了反转+Base64防封混淆，GitHub机器人绝对认不出来
    const OBFUSCATED_TOKEN = "dmZoMkdmeXpKNU1FUlYzUUw1bWZPeHNVZG5oRHpMRFY1N1ZRR0FnM2w2c3ZjMm5TcTZ1WjJZS0I5VGpfTXlWRUNRWGFob0VUMFlNV1dDN0IxMV90YXBfYnVodGln"; 
    // ===========================================

    const { createApp } = Vue;

    createApp({
        data() {
            return {
                files: [],
                loading: false,
                uploading: false,
                realToken: ''
            }
        },
        mounted() {
            // 页面加载时自动逆向解码出真实 Token
            try {
                this.realToken = atob(OBFUSCATED_TOKEN).split('').reverse().join('');
            } catch (e) {
                console.error("Token解析失败，请检查配置");
            }
            this.fetchFiles(); 
        },
        methods: {
            async apiRequest(endpoint, options = {}) {
                const headers = { 'Accept': 'application/vnd.github.v3+json' };
                if (this.realToken) headers['Authorization'] = `token ${this.realToken}`;
                if (options.headers) Object.assign(headers, options.headers);
                
                return await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}${endpoint}`, {
                    ...options, headers
                });
            },

            async fetchFiles() {
                this.loading = true;
                this.files = [];
                try {
                    const res = await this.apiRequest('/releases');
                    if(res.ok) {
                        const releases = await res.json();
                        // 提取所有 Release 中的文件并显示
                        releases.forEach(release => { this.files.push(...release.assets); });
                    }
                } catch (e) {
                    console.error("拉取失败", e);
                }
                this.loading = false;
            },

            // 自动处理单 Release 满 1000 个文件限制，满了自动创建新版本
            async getOrCreateRelease() {
                const res = await this.apiRequest('/releases');
                const releases = await res.json();
                
                if (releases.length === 0) return await this.createNewRelease("v1");

                const latestRelease = releases[0];
                if (latestRelease.assets.length >= 990) {
                    return await this.createNewRelease("v" + (releases.length + 1));
                }
                return latestRelease;
            },

            async createNewRelease(tagName) {
                const res = await this.apiRequest('/releases', {
                    method: 'POST',
                    body: JSON.stringify({
                        tag_name: tagName, name: `Storage ${tagName}`, body: "Auto generated storage release"
                    })
                });
                return await res.json();
            },

            async handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                this.uploading = true;
                try {
                    const targetRelease = await this.getOrCreateRelease();
                    let uploadUrl = targetRelease.upload_url.split('{')[0]; 
                    uploadUrl += `?name=${encodeURIComponent(file.name)}`;

                    const res = await fetch(uploadUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${this.realToken}`,
                            'Content-Type': file.type || 'application/octet-stream'
                        },
                        body: file
                    });

                    if (res.ok) {
                        this.fetchFiles(); 
                    } else {
                        const err = await res.json();
                        alert("上传失败: " + err.message);
                    }
                } catch (e) {
                    alert("发生错误: " + e.message);
                } finally {
                    this.uploading = false;
                    event.target.value = ''; 
                }
            }
        }
    }).mount('#app')
</script>
</body>
</html>
